[project]
name = "si"
version = "0.1.0"
description = "Bidirectional Qwen realtime interpretation desktop application"
requires-python = ">=3.12"
dependencies = [
    "dashscope>=1.27.5",
    "numpy>=2.5.3",
    "pyaudio>=0.2.14",
    "websocket>=0.2.1",
    "websocket-client>=1.9.2",
    "websockets>=17.1",
    "PySide6>=6.8,<7",
    "soxr>=0.5",
    "keyring>=25",
    "qtawesome>=1.3",
]

[project.gui-scripts]
si = "si.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/si"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
