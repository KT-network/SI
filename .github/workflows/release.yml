name: Build and release SI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
          - runner: ubuntu-22.04
            platform: ubuntu
            arch: x64
          - runner: macos-15-intel
            platform: macos
            arch: x64
          - runner: macos-15
            platform: macos
            arch: arm64
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install Ubuntu audio and Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            portaudio19-dev libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-randr0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
            libpulse0 libasound2 fonts-noto-cjk

      - name: Install macOS audio dependency
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install project, test, and build dependencies
        run: uv sync --group dev --group build

      - name: Run desktop application tests
        run: uv run --no-sync pytest -q --ignore=tests/test_realtime_script.py

      - name: Build and smoke-test native executable
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_BUILD: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [[ "$TAG_BUILD" == "true" ]]; then
            uv run --no-sync python tools/build_release.py --version "$RELEASE_TAG"
          else
            uv run --no-sync python tools/build_release.py
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: si-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download all native archives
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: si-*
          path: release-assets
          merge-multiple: true

      - name: Verify archive set and write SHA-256 checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          assets = Path("release-assets")
          tag = os.environ["RELEASE_TAG"]
          names = [
              f"SI-{tag}-windows-x64.zip",
              f"SI-{tag}-ubuntu-x64.tar.gz",
              f"SI-{tag}-macos-x64.zip",
              f"SI-{tag}-macos-arm64.zip",
          ]
          lines = []
          for name in names:
              path = assets / name
              if not path.is_file() or not path.stat().st_size:
                  raise SystemExit(f"Missing release archive: {name}")
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              lines.append(f"{digest}  {name}\n")
          (assets / "SHA256SUMS.txt").write_text("".join(lines), encoding="utf-8")
          PY

      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag --title "SI $GITHUB_REF_NAME" --generate-notes "${flags[@]}"
          fi
